# Horta Comunitária FCT/UFG — PostgreSQL + API + frontend (nginx). Guia: documentos/arquitetura/Deploy_Docker.md
#   cp deploy/.env.example deploy/.env          # defina a senha do banco
#   docker compose -f deploy/compose.yaml up -d --build postgres
#   docker compose -f deploy/compose.yaml run --rm migrate
#   docker compose -f deploy/compose.yaml up -d
#
# A porta fica presa ao localhost; a publicação na internet é feita pelo túnel cloudflared do projeto
# gestao-colaboradores, que alcança o alias "horta-app" pela rede externa "shared-tunnel".
name: horta-comunitaria-fct-ufg

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  Persistence__ConnectionString: Host=postgres;Port=5432;Database=horta;Username=horta;Password=${HORTA_POSTGRES_PASSWORD:?Defina HORTA_POSTGRES_PASSWORD em deploy/.env}
  AllowedHosts: ${HORTA_ALLOWED_HOSTS:-horta-comunitaria-fct-ufg.gsilverio.com.br;localhost;127.0.0.1}
  # Atrás do nginx/túnel todas as requisições chegam do mesmo IP interno; o limite vale para a instância inteira.
  Authentication__RateLimitPerMinute: ${HORTA_AUTH_RATE_LIMIT:-60}

services:
  postgres:
    image: postgres:17.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: horta
      POSTGRES_USER: horta
      POSTGRES_PASSWORD: ${HORTA_POSTGRES_PASSWORD:?Defina HORTA_POSTGRES_PASSWORD em deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horta -d horta"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Etapa controlada de deploy: docker compose -f deploy/compose.yaml run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: migrate
    image: horta-comunitaria-fct-ufg-migrate:local
    profiles: ["tools"]
    environment:
      DOTNET_ENVIRONMENT: Production
      Persistence__ConnectionString: Host=postgres;Port=5432;Database=horta;Username=horta;Password=${HORTA_POSTGRES_PASSWORD:?Defina HORTA_POSTGRES_PASSWORD em deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: api
    image: horta-comunitaria-fct-ufg-api:local
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - api-data:/app/App_Data
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: horta-comunitaria-fct-ufg-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HORTA_WEB_PORT:-5090}:8080"
    networks:
      default:
      shared-tunnel:
        aliases:
          - horta-app
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  api-data:

networks:
  default:
    name: horta-comunitaria-fct-ufg-net
  shared-tunnel:
    external: true
    name: shared-tunnel
